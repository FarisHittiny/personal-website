<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Nothing here · Faris Hittiny</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    /* Self-contained: files in public/ are copied verbatim and are not
       processed by Vite, so this page cannot reference the hashed bundle. */
    @font-face {
      font-family: "Fraunces";
      src: url("/fonts/fraunces-latin-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink-0: #0a0a0c;
      --line-0: #26262e;
      --text-0: #edede8;
      --text-1: #a8a8a4;
      --text-2: #8b8b88;
      --accent: #c9a227;
      --accent-dim: #7a6420;
      --accent-hi: #e8c558;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
      --gutter: clamp(1.25rem, 4vw, 2.5rem);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: var(--gutter);
      background: var(--ink-0);
      color: var(--text-0);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 34rem; width: 100%; }

    .code {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-2);
      margin: 0 0 1.5rem;
    }

    .code::before {
      content: "";
      display: inline-block;
      width: 1.75rem;
      height: 1px;
      background: var(--accent-dim);
      vertical-align: middle;
      margin-right: 0.75rem;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.75rem, 7vw, 4.75rem);
      line-height: 1.05;
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
    }

    h1 .dot { color: var(--accent); }

    p {
      color: var(--text-1);
      font-size: 0.9375rem;
      line-height: 1.7;
      margin: 0 0 2rem;
      max-width: 30rem;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line-0);
      margin: 0 0 2rem;
    }

    a.home {
      display: inline-block;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
      padding-bottom: 2px;
      transition: color 160ms cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    a.home:hover,
    a.home:focus-visible {
      color: var(--accent-hi);
      border-color: var(--accent-hi);
    }

    a.home:focus-visible {
      outline: 2px solid var(--accent-hi);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">HTTP 404 · No such path</p>
    <h1>Nothing here<span class="dot">.</span></h1>
    <hr />
    <p>
      That address isn't part of this site. It may have been mistyped, or it
      never existed in the first place.
    </p>
    <a class="home" href="/">&larr; Back to the homepage</a>
  </main>
</body>
</html>
