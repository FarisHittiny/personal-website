<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B0C10" />
  <title>404 · Nothing here · Faris Hittiny</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Self-contained: files in public/ are copied verbatim and are not
       processed by Vite, so this page cannot reference the hashed bundle.
       Values mirror src/styles/tokens.css. */
    @font-face {
      font-family: "Manrope";
      src: url("/fonts/manrope-latin-wght-normal.woff2") format("woff2-variations");
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --stage: #0B0C10;
      --line: #272B35;
      --ink: #F2F3F5;
      --soft: #C8CCD4;
      --mute: #9AA1AE;
      --accent: #6C8CFF;
      --glow: rgba(108, 140, 255, 0.11);
      --font: "Manrope", "Helvetica Neue", Arial, sans-serif;
      --gutter: clamp(18px, 5vw, 72px);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    html { background: var(--stage); }

    body {
      margin: 0;
      min-height: 100vh;
      padding: var(--gutter);
      background: var(--stage);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16.5px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(620px circle at 70% 30%, var(--glow), transparent 70%);
    }

    main { position: relative; max-width: 34rem; width: 100%; }

    .code {
      margin: 0 0 16px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(44px, 7vw, 72px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    h1 .dot { color: var(--accent); }

    p.lead {
      margin: 0 0 28px;
      max-width: 30rem;
      color: var(--soft);
    }

    a.home {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    a.home:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.home:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">HTTP 404 · No such path</p>
    <h1>Nothing here<span class="dot">.</span></h1>
    <p class="lead">
      That address isn't part of this site. It may have been mistyped, or it
      never existed in the first place.
    </p>
    <a class="home" href="/">&larr; Back to the homepage</a>
  </main>
</body>
</html>
