<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- FH monogram on a clear ground: no plate behind it, so the tab's own color
       shows through and the letterforms use the whole canvas (cap height 24 of
       32). Glyphs are rects, not <text> — a favicon cannot rely on the host
       having any particular monospace font.

       The mark inverts on dark browser chrome; navy on a dark tab is close to
       invisible. SVG favicons honour prefers-color-scheme, so the fill swaps
       here. The .ico and PNG fallbacks stay navy: they are static formats, and
       only browsers without SVG favicon support fall back to them.

       Colors are accent / ink-1 from src/styles/tokens.css. -->
  <style>
    .mark { fill: #16386f; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #faf8f1; }
    }
  </style>
  <g class="mark">
    <rect x="1.5" y="4" width="5" height="24"/>
    <rect x="1.5" y="4" width="12.5" height="4.6"/>
    <rect x="1.5" y="13.7" width="10.5" height="4.6"/>
    <rect x="17.5" y="4" width="5" height="24"/>
    <rect x="25.5" y="4" width="5" height="24"/>
    <rect x="17.5" y="13.7" width="13" height="4.6"/>
  </g>
</svg>
