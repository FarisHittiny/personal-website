<!doctype html>
<!-- Dev-only: the olive tree from src/floor/olive.ts, close up on the floor's ground.
     /dev/olive.html?yaw=0&cam=x,y,z -->
<html lang="en">
<head><meta charset="utf-8"><title>Olive tree mockup</title>
<style>html,body{margin:0;background:#0b0c10}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from "three";
import { buildOlive } from "/src/floor/olive.ts";

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.Fog(0x0b0c10, 16, 44);
scene.add(new THREE.HemisphereLight(0x9fb2ff, 0x07080c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(6, 12, 9); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x0f121a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const tree = buildOlive();
tree.rotation.y = Number(q.get("yaw") ?? 0) * Math.PI / 180;
scene.add(tree);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const [cx, cy, cz] = (q.get("cam") ?? "0,3.2,9").split(",").map(Number);
cam.position.set(cx, cy, cz); cam.lookAt(0, 1.7, 0);
renderer.render(scene, cam);
window.__ready = true;
</script>
</body>
</html>
